<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" role="img" aria-labelledby="pt pd">
  <title id="pt">Axon pipeline</title>
  <desc id="pd">Five stages, lighting up in sequence: ingest repos and docs, extract atomic claims, map into postgres with pgvector, detect drift when a source has changed, maintain truth continuously.</desc>
  <defs>
    <clipPath id="pcard"><rect width="860" height="200" rx="12"/></clipPath>
    <pattern id="pdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1a222c"/>
    </pattern>
    <linearGradient id="pflow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace; }
    .kicker { font-size: 11px; fill: #7d8590; letter-spacing: .16em; }
    .meta   { font-size: 11px; fill: #484f58; letter-spacing: .06em; }
    .idx    { font-size: 9.5px; fill: #58a6ff; opacity: .65; letter-spacing: .12em; }
    .stage  { font-size: 12.5px; fill: #e6edf3; }
    .detail { font-size: 9.5px; fill: #7d8590; }
    .note   { font-size: 10.5px; fill: #484f58; }

    @keyframes enter { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes lit   { 0%,100% { opacity:0; } 3% { opacity:1; } 15% { opacity:0; } }
    @keyframes chev  { 0%,100% { stroke:#484f58; } 4% { stroke:#58a6ff; } 16% { stroke:#484f58; } }
    @keyframes travel { 0% { transform: translateX(0); opacity:0; } 6% { opacity:1; }
                        94% { opacity:1; } 100% { transform: translateX(820px); opacity:0; } }
    @keyframes fade  { from { opacity:0; } to { opacity:1; } }

    .in   { animation: enter .7s cubic-bezier(.22,1,.36,1) backwards; }
    .lit  { animation: lit 5.0s linear infinite; opacity: 0; }
    .chev { animation: chev 5.0s linear infinite; }
    .pkt  { animation: travel 5.0s linear infinite; }
    .fade { animation: fade .8s ease 1.6s backwards; }
  </style>

  <g clip-path="url(#pcard)">
    <rect width="860" height="200" fill="#0d1117"/>
    <rect width="860" height="200" fill="url(#pdots)"/>

    <text class="kicker" x="20" y="28">AXON · PIPELINE</text>
    <text class="meta" x="840" y="28" text-anchor="end">ai infrastructure</text>

  <g class="in" style="animation-delay:0.25s">
    <rect x="20" y="58" width="140" height="76" rx="8" fill="#161b22" stroke="#21262d"/>
    <rect class="lit" x="20" y="58" width="140" height="76" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" style="animation-delay:0.00s"/>
    <text class="idx" x="35" y="80">01</text>
    <text class="stage" x="35" y="100">Ingest</text>
    <text class="detail" x="35" y="118">repos · docs</text>
  </g>
  <g class="in" style="animation-delay:0.35s">
    <path d="M164.0 96 H173.0" stroke="#30363d" stroke-width="1.4"/>
    <path class="chev" d="M177.0 91.5 L181.5 96 L177.0 100.5" fill="none" stroke="#484f58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.50s"/>
  </g>
  <g class="in" style="animation-delay:0.45s">
    <rect x="190" y="58" width="140" height="76" rx="8" fill="#161b22" stroke="#21262d"/>
    <rect class="lit" x="190" y="58" width="140" height="76" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" style="animation-delay:1.00s"/>
    <text class="idx" x="205" y="80">02</text>
    <text class="stage" x="205" y="100">Extract</text>
    <text class="detail" x="205" y="118">atomic claims</text>
  </g>
  <g class="in" style="animation-delay:0.55s">
    <path d="M334.0 96 H343.0" stroke="#30363d" stroke-width="1.4"/>
    <path class="chev" d="M347.0 91.5 L351.5 96 L347.0 100.5" fill="none" stroke="#484f58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.50s"/>
  </g>
  <g class="in" style="animation-delay:0.65s">
    <rect x="360" y="58" width="140" height="76" rx="8" fill="#161b22" stroke="#21262d"/>
    <rect class="lit" x="360" y="58" width="140" height="76" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" style="animation-delay:2.00s"/>
    <text class="idx" x="375" y="80">03</text>
    <text class="stage" x="375" y="100">Map</text>
    <text class="detail" x="375" y="118">postgres + pgvector</text>
  </g>
  <g class="in" style="animation-delay:0.75s">
    <path d="M504.0 96 H513.0" stroke="#30363d" stroke-width="1.4"/>
    <path class="chev" d="M517.0 91.5 L521.5 96 L517.0 100.5" fill="none" stroke="#484f58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.50s"/>
  </g>
  <g class="in" style="animation-delay:0.85s">
    <rect x="530" y="58" width="140" height="76" rx="8" fill="#161b22" stroke="#21262d"/>
    <rect class="lit" x="530" y="58" width="140" height="76" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" style="animation-delay:3.00s"/>
    <text class="idx" x="545" y="80">04</text>
    <text class="stage" x="545" y="100">Detect drift</text>
    <text class="detail" x="545" y="118">source changed?</text>
  </g>
  <g class="in" style="animation-delay:0.95s">
    <path d="M674.0 96 H683.0" stroke="#30363d" stroke-width="1.4"/>
    <path class="chev" d="M687.0 91.5 L691.5 96 L687.0 100.5" fill="none" stroke="#484f58" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:3.50s"/>
  </g>
  <g class="in" style="animation-delay:1.05s">
    <rect x="700" y="58" width="140" height="76" rx="8" fill="#161b22" stroke="#21262d"/>
    <rect class="lit" x="700" y="58" width="140" height="76" rx="8" fill="#58a6ff" fill-opacity=".06" stroke="#58a6ff" style="animation-delay:4.00s"/>
    <text class="idx" x="715" y="80">05</text>
    <text class="stage" x="715" y="100">Maintain truth</text>
    <text class="detail" x="715" y="118">continuously</text>
  </g>

    <line class="fade" x1="20" y1="156" x2="840" y2="156" stroke="url(#pflow)" stroke-width="1.5"/>
    <circle class="pkt" cx="20" cy="156" r="3.5" fill="#58a6ff"/>
    <text class="note fade" x="20" y="180">the chat box is the least interesting part — the graph and the drift detection are the product.</text>
  </g>
  <rect x=".5" y=".5" width="859" height="199" rx="12" fill="none" stroke="#21262d"/>
</svg>
