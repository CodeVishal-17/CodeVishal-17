<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180">
  <rect width="100%" height="100%" fill="#0d1117"/>

  <style>
    text{
      font-family: "JetBrains Mono", monospace;
      fill:#e6edf3;
      font-size:20px;
    }

    .line{
      opacity:0;
      animation:fade .5s forwards;
    }

    .l1{animation-delay:.2s;}
    .l2{animation-delay:1.0s;}
    .l3{animation-delay:2.0s;}
    .l4{animation-delay:3.2s;}

    @keyframes fade{
      from{opacity:0;}
      to{opacity:1;}
    }
  </style>

  <text x="30" y="45" class="line l1">&gt; booting profile...</text>
  <text x="30" y="85" class="line l2">Loading developer profile...</text>
  <text x="30" y="125" class="line l3">████████████████████ 100%</text>
  <text x="30" y="165" class="line l4">✓ Ready</text>
</svg>