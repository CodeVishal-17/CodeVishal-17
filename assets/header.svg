<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" role="img" aria-labelledby="ht hd">
  <title id="ht">Vishal — AI / ML engineer</title>
  <desc id="hd">Title card: Vishal, machine learning engineer, LLM agents and RAG systems, AI infrastructure, open source contributor. Beside it, a small neural network with signals pulsing from input to output.</desc>
  <defs>
    <clipPath id="card"><rect width="860" height="190" rx="14"/></clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1c2430"/>
    </pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#58a6ff" stop-opacity=".15"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8b96a5"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameclip"><text class="name" x="44" y="108">VISHAL</text></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace; }
    .name { font-family: "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
            font-size: 52px; font-weight: 800; letter-spacing: -1.2px; }
    .kick { font-size: 12.5px; fill: #7d8590; letter-spacing: .12em; }
    .mark { font-size: 14px; }
    .role { font-size: 14px; fill: #adbac7; opacity: 0; }
    .pulse { stroke: #58a6ff; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 18 82;
             animation: flow 3.0s linear infinite; }
    .core { animation: fire 3.0s ease-out infinite; }

    @keyframes shimmer { 0% { transform: translateX(-260px); } 100% { transform: translateX(420px); } }
    @keyframes cyc { 0%,2% { opacity:0; transform: translateY(7px); }
                     6%,22% { opacity:1; transform: none; }
                     26%,100% { opacity:0; transform: translateY(-7px); } }
    @keyframes flow { 0% { stroke-dashoffset:118; opacity:0; } 8% { opacity:.95; }
                      36% { stroke-dashoffset:0; opacity:.95; } 44% { opacity:0; }
                      100% { stroke-dashoffset:0; opacity:0; } }
    @keyframes fire { 0%,100% { opacity:.2; } 5% { opacity:1; } 30% { opacity:.2; } }
    @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes drawline { from { stroke-dashoffset: 260; } to { stroke-dashoffset: 0; } }

    .shine { animation: shimmer 4.5s cubic-bezier(.5,0,.5,1) 1.2s infinite; }
    .r0 { animation: cyc 13s ease-in-out 0s    infinite; }
    .r1 { animation: cyc 13s ease-in-out 3.25s infinite; }
    .r2 { animation: cyc 13s ease-in-out 6.5s  infinite; }
    .r3 { animation: cyc 13s ease-in-out 9.75s infinite; }
    .in   { animation: rise .7s cubic-bezier(.22,1,.36,1) .1s backwards; }
    .rule { stroke-dasharray: 260; animation: drawline 1.3s cubic-bezier(.22,1,.36,1) .3s backwards; }
  </style>

  <g clip-path="url(#card)">
    <rect width="860" height="190" fill="#0d1117"/>
