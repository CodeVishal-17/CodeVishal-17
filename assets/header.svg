<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="ht hd">
  <title id="ht">Vishal — AI / ML engineer</title>
  <desc id="hd">Animated title card. Machine learning engineer, LLM agents and RAG systems, AI infrastructure, open source contributor. Python, PyTorch, FastAPI, PostgreSQL, Docker.</desc>
  <defs>
    <clipPath id="hcard"><rect width="860" height="300" rx="14"/></clipPath>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#1c2430"/>
    </pattern>
    <radialGradient id="glowA"><stop offset="0" stop-color="#58a6ff" stop-opacity=".16"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#a371f7" stop-opacity=".13"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8b96a5"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#58a6ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameclip"><text class="name" x="46" y="136">VISHAL</text></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,monospace; }
    .name { font-family: "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
            font-size: 68px; font-weight: 800; letter-spacing: -1.5px; }
    .kick { font-size: 13px; fill: #7d8590; letter-spacing: .12em; }
    .mark { font-size: 15.5px; }
    .role { font-size: 15.5px; fill: #adbac7; opacity: 0; }
    .chiptxt { font-size: 12px; fill: #7d8590; letter-spacing: .04em;
               font-family: ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; }

    @keyframes shimmer { 0% { transform: translateX(-320px); } 100% { transform: translateX(760px); } }
    @keyframes cyc { 0%,2% { opacity:0; transform: translateY(8px); }
                     6%,22% { opacity:1; transform: none; }
                     26%,100% { opacity:0; transform: translateY(-8px); } }
    @keyframes scanline { 0% { transform: translateY(-10px); opacity:0; }
                          12% { opacity:1; } 88% { opacity:1; }
                          100% { transform: translateY(310px); opacity:0; } }
    @keyframes float { 0%,100% { transform: none; } 50% { transform: translate(34px,-22px); } }
    @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes drawline { from { stroke-dashoffset: 300; } to { stroke-dashoffset: 0; } }

    .shine { animation: shimmer 4.5s cubic-bezier(.5,0,.5,1) 1.2s infinite; }
    .r0 { animation: cyc 13s ease-in-out 0s    infinite; }
    .r1 { animation: cyc 13s ease-in-out 3.25s infinite; }
    .r2 { animation: cyc 13s ease-in-out 6.5s  infinite; }
    .r3 { animation: cyc 13s ease-in-out 9.75s infinite; }
    .scanl { animation: scanline 7s ease-in-out 1s infinite; }
    .blob  { animation: float 16s ease-in-out infinite; }
    .chip  { animation: rise .7s cubic-bezier(.22,1,.36,1) backwards; }
    .cur   { animation: blink 1.1s steps(1) infinite; }
    .rule  { stroke-dasharray: 300; animation: drawline 1.4s cubic-bezier(.22,1,.36,1) .3s backwards; }
    .kickin { animation: rise .7s cubic-bezier(.22,1,.36,1) .1s backwards; }
  </style>

  <g clip-path="url(#hcard)">
    <rect width="860" height="300" fill="#0d1117"/>
    <rect width="860" height="300" fill="url(#dots)"/>
    <circle class="blob" cx="700" cy="70"  r="230" fill="url(#glowA)"/>
    <circle class="blob" cx="120" cy="290" r="200" fill="url(#glowB)" style="animation-delay:-8s"/>
    <rect class="scanl" x="0" y="0" width="860" height="2" fill="url(#scan)"/>

    <text class="mono kick kickin" x="48" y="54"><tspan fill="#58a6ff">$</tspan> whoami</text>

    <g clip-path="url(#nameclip)">
      <rect x="40" y="72" width="520" height="80" fill="url(#metal)"/>
      <rect class="shine" x="40" y="72" width="240" height="80" fill="url(#sweep)"/>
    </g>
    <line class="rule" x1="48" y1="152" x2="348" y2="152" stroke="#30363d" stroke-width="1.5"/>

    <g class="mono">
      <text class="mark" x="48" y="180" fill="#58a6ff">▸</text>
    <text class="role r0" x="70" y="180">machine learning engineer</text>
    <text class="role r1" x="70" y="180">llm agents &amp; rag systems</text>
    <text class="role r2" x="70" y="180">ai infrastructure</text>
    <text class="role r3" x="70" y="180">open source contributor</text>
    </g>

    <g class="chip" style="animation-delay:1.00s">
      <rect x="48" y="230" width="67" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text class="chiptxt" x="82" y="249" text-anchor="middle">Python</text>
    </g>
    <g class="chip" style="animation-delay:1.12s">
      <rect x="125" y="230" width="74" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text class="chiptxt" x="162" y="249" text-anchor="middle">PyTorch</text>
    </g>
    <g class="chip" style="animation-delay:1.24s">
      <rect x="209" y="230" width="74" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text class="chiptxt" x="246" y="249" text-anchor="middle">FastAPI</text>
    </g>
    <g class="chip" style="animation-delay:1.36s">
      <rect x="293" y="230" width="95" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text class="chiptxt" x="340" y="249" text-anchor="middle">PostgreSQL</text>
    </g>
    <g class="chip" style="animation-delay:1.48s">
      <rect x="398" y="230" width="67" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
      <text class="chiptxt" x="432" y="249" text-anchor="middle">Docker</text>
    </g>

    <g stroke="#58a6ff" stroke-width="1.6" fill="none" opacity=".45">
      <path d="M18 40 V18 H40"/><path d="M842 40 V18 H820"/>
      <path d="M18 260 V282 H40"/><path d="M842 260 V282 H820"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="859" height="299" rx="14" fill="none" stroke="#21262d"/>
</svg>
